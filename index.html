<style>
/* Layout: cartel de gimnasio. Cabecera con la semana, luego un bloque por día con 6 fichas en orden de ejecución. */
:root {
  --bg: #eef0ee;
  --paper: #ffffff;
  --ink: #1b1f1d;
  --ink-2: #5d6661;
  --line: #d5dad6;
  --far: #9aa39e;
  --d1: #2459c9;
  --d2: #d8571b;
  --d3: #1d8a52;
  --d4: #b62d77;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131615; --paper: #1c201e; --ink: #ecefed; --ink-2: #a3aca7; --line: #2f3532; --far: #66706b;
    --d1: #7aa2ff; --d2: #ff9257; --d3: #4fd08e; --d4: #ff73bd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131615; --paper: #1c201e; --ink: #ecefed; --ink-2: #a3aca7; --line: #2f3532; --far: #66706b;
  --d1: #7aa2ff; --d2: #ff9257; --d3: #4fd08e; --d4: #ff73bd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
button, a, input { touch-action: manipulation; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 0.95; }
header { display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-size: clamp(48px, 9vw, 104px); font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; }
h1 span { color: var(--d2); }
.lede { max-width: 62ch; margin: 0; color: var(--ink-2); font-size: 16px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 8px 10px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink-2); text-decoration: none; }
.wd b { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--ink); }
.wd small { font-size: 12px; font-weight: 600; line-height: 1.2; }
a.wd { background: var(--c); border-color: var(--c); color: var(--paper); }
a.wd b { color: var(--paper); }
a.wd:hover { filter: brightness(1.08); }
a.wd:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.rule { background: var(--paper); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.rule strong { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.rule p { margin: 0; font-size: 14px; color: var(--ink-2); }

section.day { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 16px; }
.dayhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; border-bottom: 4px solid var(--c); padding-bottom: 10px; }
.dayhead .tag { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--c); text-transform: uppercase; letter-spacing: .04em; }
.dayhead h2 { font-size: clamp(38px, 6vw, 60px); font-weight: 900; text-transform: uppercase; }
.dayhead p { margin: 4px 0 0; color: var(--ink-2); max-width: 60ch; }
.reset { font: 600 13px var(--body); background: none; border: 1.5px solid var(--line); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.reset:hover { border-color: var(--c); color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .sets > span { display: none; } .grid { grid-template-columns: 1fr; } .week { grid-template-columns: repeat(4, minmax(0, 1fr)); } .wd.off { display: none; } }

.card { background: var(--paper); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.art { position: relative; background: color-mix(in srgb, var(--c) 9%, var(--paper)); aspect-ratio: 16 / 11; max-width: 100%; }
.art svg { width: 100%; height: 100%; display: block; }
.num { position: absolute; top: 10px; left: 12px; font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--c); line-height: 1; }
.scheme { position: absolute; top: 12px; right: 12px; font-family: var(--display); font-weight: 800; font-size: 18px; background: var(--ink); color: var(--paper); border-radius: 4px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.body h3 { font-size: 27px; font-weight: 800; text-transform: uppercase; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--bg); color: var(--ink-2); }
.chip.rest { background: color-mix(in srgb, var(--c) 15%, var(--paper)); color: var(--ink); }
.tip { margin: 0; font-size: 14px; }
.sets { display: flex; align-items: center; gap: 6px; padding-top: 6px; }
.peso { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.peso-row { display: flex; align-items: center; gap: 8px; }
.peso label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.peso input { width: 76px; font: 700 16px var(--body); padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
.peso input:focus { outline: none; border-color: var(--c); }
.peso .kg { font-size: 13px; color: var(--ink-2); }
.peso .guardar { font: 700 13px var(--body); background: var(--c); color: var(--paper); border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.peso .last { margin: 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.peso .last b { color: var(--ink); }
.sets span { font-size: 12px; color: var(--ink-2); margin-right: 4px; font-weight: 600; }
.set { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: none; color: var(--ink-2); font: 700 13px var(--body); cursor: pointer; font-variant-numeric: tabular-nums; }
.set[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--paper); }
.set { flex-shrink: 0; }
.all { flex-shrink: 0; white-space: nowrap; margin-left: auto; height: 30px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--c); background: none; color: var(--c); font: 700 13px var(--body); cursor: pointer; }
.all[aria-pressed="true"] { background: var(--c); color: var(--paper); }

/* figura */
.fig line, .fig polyline { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig .limb { stroke: var(--ink); stroke-width: 7; }
.fig .far { stroke: var(--far); stroke-width: 6.5; }
.fig .torso { stroke: var(--ink); stroke-width: 10; }
.fig .head { fill: var(--ink); }
.fig .floor { stroke: var(--line); stroke-width: 2; }
.fig .eq { stroke: var(--c); stroke-width: 4; fill: none; stroke-linecap: round; }
.fig .eqf { fill: var(--c); }
.fig .gear { stroke: var(--ink-2); stroke-width: 4; fill: none; stroke-linecap: round; }
.fig .gearf { fill: var(--line); stroke: var(--ink-2); stroke-width: 2; }
.fig .mv { stroke: var(--c); stroke-width: 2.5; fill: none; stroke-dasharray: 4 4; }
.fig .mvh { fill: var(--c); }

footer { color: var(--ink-2); font-size: 13px; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .set { transition: background .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Plan <span>6×6</span></h1>
    <nav class="week" aria-label="Semana">
      <a class="wd" href="#superior" style="--c:var(--d1)"><b>Lun</b><small>Espalda y brazos</small></a>
      <div class="wd off"><b>Mar</b><small>Descanso</small></div>
      <a class="wd" href="#gluteo" style="--c:var(--d4)"><b>Mié</b><small>Glúteo</small></a>
      <div class="wd off"><b>Jue</b><small>Descanso</small></div>
      <a class="wd" href="#abs" style="--c:var(--d2)"><b>Vie</b><small>Abdominales</small></a>
      <div class="wd off"><b>Sáb</b><small>Descanso</small></div>
      <a class="wd" href="#piernas" style="--c:var(--d3)"><b>Dom</b><small>Piernas</small></a>
    </nav>
  </header>

  <main id="days" class="wrap"></main>

</div>

<script>
const P = (x, y) => [x, y];
const ln = (a, b, c) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${c}"/>`;
const pl = (pts, c) => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" class="${c}"/>`;
const plate = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" class="eqf"/><circle cx="${x}" cy="${y}" r="${r * 0.3}" fill="var(--paper)"/>`;
const db = (x, y, v) => v
  ? `<line x1="${x}" y1="${y - 7}" x2="${x}" y2="${y + 7}" class="eq"/><rect x="${x - 5}" y="${y - 10}" width="10" height="5" rx="1.5" class="eqf"/><rect x="${x - 5}" y="${y + 5}" width="10" height="5" rx="1.5" class="eqf"/>`
  : `<line x1="${x - 7}" y1="${y}" x2="${x + 7}" y2="${y}" class="eq"/><rect x="${x - 10}" y="${y - 5}" width="5" height="10" rx="1.5" class="eqf"/><rect x="${x + 5}" y="${y - 5}" width="5" height="10" rx="1.5" class="eqf"/>`;
const bench = (x1, x2, y) => `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="6" rx="2" class="gearf"/><line x1="${x1 + 6}" y1="${y + 6}" x2="${x1 + 6}" y2="110" class="gear"/><line x1="${x2 - 6}" y1="${y + 6}" x2="${x2 - 6}" y2="110" class="gear"/>`;
const pullbar = (x1, x2) => `<line x1="${x1}" y1="12" x2="${x2}" y2="12" class="gear"/><line x1="${x1}" y1="12" x2="${x1}" y2="110" class="gear"/><line x1="${x2}" y1="12" x2="${x2}" y2="110" class="gear"/>`;
const arrow = (pts) => {
  const [a, b] = [pts[pts.length - 2], pts[pts.length - 1]];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const h = (d) => [b[0] - 7 * Math.cos(ang + d), b[1] - 7 * Math.sin(ang + d)];
  return pl(pts, 'mv') + `<polygon points="${b.join(',')} ${h(0.5).join(',')} ${h(-0.5).join(',')}" class="mvh"/>`;
};

// Pose: h cabeza, n hombros, p cadera, a/l brazo y pierna cercanos [codo, mano] / [rodilla, pie];
// a2/l2 lejanos (si faltan se copian desplazados). back = material detrás, front = delante.
function fig(o) {
  const sh = (seg, dx) => seg.map(([x, y]) => [x + dx, y]);
  const a2 = o.a2 || sh(o.a, -4), l2 = o.l2 || sh(o.l, -4);
  const farC = o.flat ? 'limb' : 'far';
  return `<svg viewBox="0 0 160 120" class="fig" role="img" aria-label="${o.label}">
    <line x1="6" y1="110" x2="154" y2="110" class="floor"/>
    ${o.back || ''}
    ${pl([o.n, ...a2], farC)}${pl([o.p, ...l2], farC)}
    ${ln(o.p, o.n, 'torso')}
    ${pl([o.p, ...o.l], 'limb')}${pl([o.n, ...o.a], 'limb')}
    <circle cx="${o.h[0]}" cy="${o.h[1]}" r="8.5" class="head"/>
    ${o.front || ''}
  </svg>`;
}

const DAYS = [
  { id: 'superior', c: 'var(--d1)', tag: 'Día 1 · Lunes', title: 'Espalda y brazos',
    intro: 'Primero los tirones grandes de espalda, después bíceps y tríceps cuando ya están calientes.',
    ex: [
      { n: 'Dominadas', m: 'Dorsal, bíceps', r: '2–3 min',
        t: 'Agarre algo más ancho que los hombros. Baja los hombros antes de tirar y sube hasta pasar la barbilla. Si no llegas a 6, usa banda o máquina asistida.',
        f: { label: 'Dominada en la barra', flat: true, h: P(80, 24), n: P(80, 36), p: P(80, 68),
             a: [P(60, 36), P(62, 13)], a2: [P(100, 36), P(98, 13)],
             l: [P(76, 88), P(84, 100)], l2: [P(84, 88), P(92, 98)],
             back: pullbar(40, 120) + `<line x1="40" y1="12" x2="120" y2="12" class="eq"/>` } },
      { n: 'Remo con barra', m: 'Dorsal, romboides', r: '2–3 min',
        t: 'Inclina el tronco unos 45° con la espalda neutra. Lleva la barra al ombligo con los codos pegados y aprieta las escápulas arriba.',
        f: { label: 'Remo con barra inclinado', h: P(110, 44), n: P(98, 52), p: P(62, 68),
             a: [P(82, 48), P(88, 68)], l: [P(76, 86), P(72, 108)],
             front: plate(88, 74, 11) + arrow([[100, 92], [100, 76]]) } },
      { n: 'Remo a una mano', m: 'Dorsal, deltoides posterior', r: '90 s',
        t: 'Rodilla y mano en el banco, espalda plana. Tira de la mancuerna hacia la cadera, no hacia el pecho. 6 por lado.',
        f: { label: 'Remo con mancuerna apoyado en banco', h: P(48, 40), n: P(58, 46), p: P(94, 48),
             a: [P(72, 40), P(70, 58)], a2: [P(56, 60), P(54, 74)],
             l: [P(96, 72), P(122, 72)], l2: [P(104, 78), P(108, 108)],
             back: bench(40, 128, 76), front: db(70, 60, true) } },
      { n: 'Curl con barra', m: 'Bíceps', r: '90 s',
        t: 'Codos fijos junto al cuerpo y sin balancear el tronco. Sube en un segundo y baja en dos o tres.',
        f: { label: 'Curl de bíceps con barra de pie', h: P(80, 18), n: P(80, 30), p: P(80, 64),
             a: [P(84, 48), P(100, 36)], l: [P(82, 86), P(82, 108)],
             front: plate(102, 36, 10) + arrow([[118, 60], [118, 42]]) } },
      { n: 'Press francés', m: 'Tríceps', r: '90 s',
        t: 'Tumbado en el banco, brazos casi verticales. Solo se mueven los codos: baja la barra hacia la frente y extiende sin abrir los codos.',
        f: { label: 'Press francés tumbado en banco', h: P(36, 70), n: P(48, 74), p: P(84, 74),
             a: [P(46, 50), P(32, 56)], l: [P(102, 74), P(104, 108)],
             back: bench(26, 96, 80), front: plate(30, 56, 8) } },
      { n: 'Fondos en banco', m: 'Tríceps, pecho', r: '90 s',
        t: 'Manos en el borde del banco, cadera cerca de él. Baja hasta que los codos formen 90° y empuja. Para más carga, apoya los pies en otro banco.',
        f: { label: 'Fondos de tríceps en banco', h: P(68, 54), n: P(66, 66), p: P(66, 94),
             a: [P(48, 82), P(52, 70)], l: [P(92, 98), P(122, 106)],
             back: bench(18, 58, 70) + arrow([[82, 40], [82, 56]]) } },
    ] },
  { id: 'abs', c: 'var(--d2)', tag: 'Día 3 · Viernes', title: 'Abdominales',
    intro: 'Todos con carga: elige un peso con el que la 6.ª repetición cueste. Movimientos lentos y controlados, exhala al contraer.',
    ex: [
      { n: 'Crunch en polea alta', m: 'Recto abdominal', r: '60–90 s',
        t: 'De rodillas frente a la polea, cuerda junto a la cabeza. Enrolla el tronco llevando los codos hacia los muslos sin mover la cadera. Peso con el que la 6.ª cueste.',
        f: { label: 'Crunch de rodillas en polea alta con cuerda', h: P(108, 96), n: P(100, 86), p: P(78, 82),
             a: [P(92, 74), P(104, 80)], l: [P(76, 106), P(52, 106)],
             back: `<line x1="138" y1="12" x2="138" y2="110" class="gear"/><line x1="138" y1="12" x2="110" y2="12" class="gear"/><rect x="126" y="70" width="16" height="30" rx="2" class="gearf"/>`,
             front: `<line x1="110" y1="14" x2="105" y2="80" class="eq"/>` + arrow([[124, 52], [118, 74]]) } },
      { n: 'Sit-up con disco', m: 'Recto abdominal', r: '60–90 s',
        t: 'Tumbada con rodillas dobladas y pies sujetos bajo un banco o una barra. Disco abrazado al pecho: sube hasta quedar sentada y baja despacio, en 3 s.',
        f: { label: 'Sit-up con disco abrazado al pecho', h: P(52, 66), n: P(58, 77), p: P(76, 102),
             a: [P(70, 88), P(66, 78)], l: [P(96, 80), P(110, 106)],
             front: plate(64, 80, 8) + arrow([[34, 100], [40, 76]]) } },
      { n: 'Pallof press', m: 'Oblicuos, antirrotación', r: '60 s',
        t: 'De lado a la polea, agarre a la altura del pecho. Estira los brazos al frente sin dejar que el tronco gire hacia la polea, aguanta 2 s y vuelve. 6 por lado.',
        f: { label: 'Pallof press de pie con polea lateral', flat: true, h: P(80, 20), n: P(80, 32), p: P(80, 64),
             a: [P(72, 46), P(80, 42)], a2: [P(88, 46), P(80, 42)],
             l: [P(72, 86), P(68, 108)], l2: [P(88, 86), P(92, 108)],
             back: `<line x1="140" y1="12" x2="140" y2="110" class="gear"/><rect x="128" y="74" width="16" height="30" rx="2" class="gearf"/>`,
             front: `<line x1="140" y1="42" x2="84" y2="42" class="eq"/><circle cx="80" cy="42" r="4" class="eqf"/>` } },
      { n: 'Giro ruso con peso', m: 'Oblicuos', r: '60 s',
        t: 'Sentado en V, pies en el aire. Gira el tronco entero, no solo los brazos, y toca el suelo a cada lado. 6 por lado.',
        f: { label: 'Giro ruso sentado con mancuerna', h: P(54, 58), n: P(60, 70), p: P(74, 102),
             a: [P(72, 82), P(88, 90)], l: [P(96, 82), P(116, 90)],
             front: db(90, 90, false) + arrow([[70, 112], [102, 112]]) } },
      { n: 'Dead bug', m: 'Transverso, estabilidad', r: '60 s',
        t: 'Con una mancuerna o disco en las manos y la lumbar pegada al suelo. Extiende brazo y pierna contrarios muy despacio, 3 s de bajada. 6 por lado.',
        f: { label: 'Dead bug tumbado boca arriba', h: P(36, 98), n: P(46, 101), p: P(82, 101),
             a: [P(32, 96), P(16, 92)], a2: [P(48, 84), P(50, 64)],
             l: [P(104, 98), P(126, 94)], l2: [P(84, 78), P(106, 78)],
             front: plate(50, 62, 7) + plate(16, 92, 7) } },
      { n: 'Plancha con remo', m: 'Core completo, oblicuos', r: '60–90 s',
        t: 'Plancha alta con las manos sobre dos mancuernas y pies algo abiertos. Rema una hacia la cadera sin rotar la pelvis, apoya y cambia. 6 por lado.',
        f: { label: 'Plancha con remo sobre mancuernas', h: P(118, 72), n: P(108, 78), p: P(64, 86),
             a: [P(96, 70), P(102, 88)], a2: [P(110, 92), P(110, 103)],
             l: [P(42, 96), P(20, 106)],
             back: db(110, 105, false), front: db(102, 90, false) + arrow([[124, 104], [124, 84]]) } },
    ] },
  { id: 'piernas', c: 'var(--d3)', tag: 'Día 4 · Domingo', title: 'Piernas',
    intro: 'Cuádriceps, isquios y gemelos. La sentadilla es el ejercicio más pesado de la semana: dale los descansos completos.',
    ex: [

// Sin zoom: iOS ignora a veces user-scalable, así que se bloquea el pellizco; el doble toque lo quita touch-action.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// Actualización automática: GitHub Pages guarda la página en caché unos minutos.
// Si version.txt no coincide con esta versión, se recarga con una URL nueva.
const VERSION = '4';
fetch('./version.txt', { cache: 'no-store' }).then(r => r.ok ? r.text() : VERSION).then(v => {
  v = v.trim();
  if (v && v !== VERSION && !location.search.includes('v=' + v)) location.replace('./?v=' + v);
}).catch(() => {});

let store = {};
try { store = JSON.parse(localStorage.getItem('plan6x6') || '{}'); } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem('plan6x6', JSON.stringify(store)); } catch (e) {} };

// Pesos: historial por ejercicio { 'abs-Sit-up con disco': [{ w: 10, d: '2026-10-30' }, ...] }
let pesos = {};
try { pesos = JSON.parse(localStorage.getItem('plan6x6-pesos') || '{}'); } catch (e) { pesos = {}; }
const savePesos = () => { try { localStorage.setItem('plan6x6-pesos', JSON.stringify(pesos)); } catch (e) {} };
const fmtW = w => String(w).replace('.', ',');
const fmtD = d => new Date(d + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
function lastText(k) {
  const h = pesos[k] || [];
  if (!h.length) return 'Aún sin peso apuntado.';
  const a = h[h.length - 1], b = h[h.length - 2];
  let t = `Última vez: <b>${fmtW(a.w)} kg</b> · ${fmtD(a.d)}`;
  if (b) t += ` <span>(antes ${fmtW(b.w)} kg)</span>`;
  return t;
}

// Fuente de titulares sin bloquear la carga: la página se pinta antes con la fuente del sistema.
const fl = document.createElement('link');
fl.rel = 'stylesheet';
fl.href = 'https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap';
document.head.appendChild(fl);

const main = document.getElementById('days');
main.innerHTML = [...DAYS].sort((a, b) => a.tag.localeCompare(b.tag)).map(d => `
  <section class="day" id="${d.id}" style="--c:${d.c}">
    <div class="dayhead">
      <div>
        <div class="tag">${d.tag}</div>
        <h2>${d.title}</h2>
        <p>${d.intro}</p>
      </div>
      <button class="reset" type="button" id="reset-${d.id}" data-day="${d.id}">Reiniciar series</button>
    </div>
    <div class="grid">
      ${d.ex.map((e, i) => `
        <article class="card">
          <div class="art"><span class="num">${i + 1}</span><span class="scheme">6×6</span>${fig(e.f)}</div>
          <div class="body">
            <h3>${e.n}</h3>
            <div class="meta"><span class="chip">${e.m}</span><span class="chip rest">Descanso ${e.r}</span></div>
            <p class="tip">${e.t}</p>
            <div class="peso">
              <div class="peso-row">
                <label for="peso-${d.id}-${i}">Peso</label>
                <input id="peso-${d.id}-${i}" type="text" inputmode="decimal" placeholder="0" value="${(pesos[d.id + '-' + e.n] || []).slice(-1).map(x => fmtW(x.w)).join('')}">
                <span class="kg">kg</span>
                <button class="guardar" type="button" data-peso="${d.id}-${e.n}" data-input="peso-${d.id}-${i}">Guardar</button>
              </div>
              <p class="last" id="last-${d.id}-${i}">${lastText(d.id + '-' + e.n)}</p>
            </div>
            <div class="sets"><span>Series</span>
              ${[1, 2, 3, 4, 5, 6].map(s => {
                const k = `${d.id}-${i}-${s}`;
                return `<button class="set" type="button" id="set-${k}" data-k="${k}" aria-pressed="${!!store[k]}" aria-label="Serie ${s} de ${e.n}">${s}</button>`;
              }).join('')}
              <button class="all" type="button" id="all-${d.id}-${i}" data-all="${d.id}-${i}" aria-pressed="${[1, 2, 3, 4, 5, 6].every(s => store[`${d.id}-${i}-${s}`])}" aria-label="Marcar las 6 series de ${e.n}">✓ Todas</button>
            </div>
          </div>
        </article>`).join('')}
    </div>
  </section>`).join('');

const syncAll = ex => {
  const on = [1, 2, 3, 4, 5, 6].every(s => store[`${ex}-${s}`]);
  document.getElementById('all-' + ex).setAttribute('aria-pressed', on);
};

main.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.peso) {
    const inp = document.getElementById(b.dataset.input);
    const w = parseFloat(inp.value.replace(',', '.'));
    if (!(w >= 0)) { inp.focus(); return; }
    const k = b.dataset.peso, hoy = new Date().toLocaleDateString('sv');
    const h = pesos[k] = pesos[k] || [];
    if (h.length && h[h.length - 1].d === hoy) h[h.length - 1].w = w; else h.push({ w, d: hoy });
    if (h.length > 30) h.splice(0, h.length - 30);
    savePesos();
    inp.value = fmtW(w);
    document.getElementById(b.dataset.input.replace('peso-', 'last-')).innerHTML = lastText(k);
    b.textContent = 'Guardado ✓';
    setTimeout(() => { b.textContent = 'Guardar'; }, 1500);
    return;
  }
  if (b.dataset.k) {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    if (on) store[b.dataset.k] = 1; else delete store[b.dataset.k];
    save();
    syncAll(b.dataset.k.replace(/-\d+$/, ''));
  } else if (b.dataset.all) {
    const ex = b.dataset.all, on = b.getAttribute('aria-pressed') !== 'true';
    for (let s = 1; s <= 6; s++) {
      const k = `${ex}-${s}`;
      if (on) store[k] = 1; else delete store[k];
      document.getElementById('set-' + k).setAttribute('aria-pressed', on);
    }
    b.setAttribute('aria-pressed', on);
    save();
  } else if (b.dataset.day) {
    const day = b.dataset.day;
    Object.keys(store).forEach(k => { if (k.startsWith(day + '-')) delete store[k]; });
    document.querySelectorAll(`#${day} .set, #${day} .all`).forEach(s => s.setAttribute('aria-pressed', 'false'));
    save();
  }
});
</script>

</body></html>
