<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: cartel de gimnasio. Cabecera con la semana, luego un bloque por día con 6 fichas en orden de ejecución. */
:root {
  --bg: #eef0ee;
  --paper: #ffffff;
  --ink: #1b1f1d;
  --ink-2: #5d6661;
  --line: #d5dad6;
  --far: #9aa39e;
  --d1: #2459c9;
  --d2: #d8571b;
  --d3: #1d8a52;
  --d4: #b62d77;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131615; --paper: #1c201e; --ink: #ecefed; --ink-2: #a3aca7; --line: #2f3532; --far: #66706b;
    --d1: #7aa2ff; --d2: #ff9257; --d3: #4fd08e; --d4: #ff73bd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131615; --paper: #1c201e; --ink: #ecefed; --ink-2: #a3aca7; --line: #2f3532; --far: #66706b;
  --d1: #7aa2ff; --d2: #ff9257; --d3: #4fd08e; --d4: #ff73bd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
button, a, input { touch-action: manipulation; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 0.95; }
header { display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-size: clamp(48px, 9vw, 104px); font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; }
h1 span { color: var(--d2); }
.lede { max-width: 62ch; margin: 0; color: var(--ink-2); font-size: 16px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 8px 10px; min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink-2); text-decoration: none; }
.wd b { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--ink); }
.wd small { font-size: 12px; font-weight: 600; line-height: 1.2; }
a.wd { background: var(--c); border-color: var(--c); color: var(--paper); }
a.wd b { color: var(--paper); }
a.wd:hover { filter: brightness(1.08); }
a.wd:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.rule { background: var(--paper); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.rule strong { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.rule p { margin: 0; font-size: 14px; color: var(--ink-2); }

section.day { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 16px; }
.dayhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; border-bottom: 4px solid var(--c); padding-bottom: 10px; }
.dayhead .tag { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--c); text-transform: uppercase; letter-spacing: .04em; }
.dayhead h2 { font-size: clamp(38px, 6vw, 60px); font-weight: 900; text-transform: uppercase; }
.dayhead p { margin: 4px 0 0; color: var(--ink-2); max-width: 60ch; }
.reset { font: 600 13px var(--body); background: none; border: 1.5px solid var(--line); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.reset:hover { border-color: var(--c); color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .sets > span { display: none; } .grid { grid-template-columns: 1fr; } .week { grid-template-columns: repeat(4, minmax(0, 1fr)); } .wd.off { display: none; } }

.card { background: var(--paper); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.art { position: relative; background: color-mix(in srgb, var(--c) 9%, var(--paper)); aspect-ratio: 16 / 11; max-width: 100%; }
.art svg { width: 100%; height: 100%; display: block; }
.num { position: absolute; top: 10px; left: 12px; font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--c); line-height: 1; }
.scheme { position: absolute; top: 12px; right: 12px; font-family: var(--display); font-weight: 800; font-size: 18px; background: var(--ink); color: var(--paper); border-radius: 4px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.body h3 { font-size: 27px; font-weight: 800; text-transform: uppercase; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--bg); color: var(--ink-2); }
.chip.rest { background: color-mix(in srgb, var(--c) 15%, var(--paper)); color: var(--ink); }
.tip { margin: 0; font-size: 14px; }
.sets { display: flex; align-items: center; gap: 6px; padding-top: 6px; }
.peso { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.peso-row { display: flex; align-items: center; gap: 8px; }
.peso label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.peso input { width: 76px; font: 700 16px var(--body); padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
.peso input:focus { outline: none; border-color: var(--c); }
.peso .kg { font-size: 13px; color: var(--ink-2); }
.peso .guardar { font: 700 13px var(--body); background: var(--c); color: var(--paper); border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.peso .last { margin: 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.peso .last b { color: var(--ink); }
.sets span { font-size: 12px; color: var(--ink-2); margin-right: 4px; font-weight: 600; }
.set { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: none; color: var(--ink-2); font: 700 13px var(--body); cursor: pointer; font-variant-numeric: tabular-nums; }
.set[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--paper); }
.set { flex-shrink: 0; }
.all { flex-shrink: 0; white-space: nowrap; margin-left: auto; height: 30px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--c); background: none; color: var(--c); font: 700 13px var(--body); cursor: pointer; }
.all[aria-pressed="true"] { background: var(--c); color: var(--paper); }

/* figura */
.fig line, .fig polyline { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig .limb { stroke: var(--ink); stroke-width: 7; }
.fig .far { stroke: var(--far); stroke-width: 6.5; }
.fig .torso { stroke: var(--ink); stroke-width: 10; }
.fig .head { fill: var(--ink); }
.fig .floor { stroke: var(--line); stroke-width: 2; }
.fig .eq { stroke: var(--c); stroke-width: 4; fill: none; stroke-linecap: round; }
.fig .eqf { fill: var(--c); }
.fig .gear { stroke: var(--ink-2); stroke-width: 4; fill: none; stroke-linecap: round; }
.fig .gearf { fill: var(--line); stroke: var(--ink-2); stroke-width: 2; }
.fig .mv { stroke: var(--c); stroke-width: 2.5; fill: none; stroke-dasharray: 4 4; }
.fig .mvh { fill: var(--c); }

footer { color: var(--ink-2); font-size: 13px; max-width: 70ch; }
/* Barra de progreso del día: sticky arriba, se rellena en verde con las series marcadas. */
:root { --ok: #23a55a; }
.prog { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-top: -12px; padding-block: 10px; background: var(--bg); }
.prog-bar { position: relative; height: 28px; border-radius: 999px; background: var(--line); overflow: hidden; }
.prog-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ok); border-radius: 999px; }
.prog-txt { position: absolute; inset: 0; display: grid; place-items: center; font: 800 14px var(--body); color: var(--ink); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .prog-fill { transition: width .3s ease; } }
/* Un día a la vez: el resto de días queda oculto y el día elegido se resalta en la semana. */
section.day:not(.on) { display: none; }
a.wd:not(.on) { opacity: .4; }
a.wd.on { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--c); }
.voto { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
.voto span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.voto button { font-size: 20px; line-height: 1; width: 44px; height: 38px; border-radius: 999px; border: 2px solid var(--line); background: none; cursor: pointer; filter: grayscale(1); opacity: .6; }
.voto button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 15%, var(--paper)); filter: none; opacity: 1; }
.valoraciones { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
.valoraciones button { font: 600 13px var(--body); background: none; border: 1.5px solid var(--line); color: var(--ink-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .set { transition: background .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Plan <span>6×6</span></h1>
    <nav class="week" aria-label="Semana">
      <a class="wd" href="#superior" style="--c:var(--d1)"><b>Lun</b><small>Espalda y brazos</small></a>
      <div class="wd off"><b>Mar</b><small>Cardio</small></div>
      <a class="wd" href="#abs" style="--c:var(--d2)"><b>Mié</b><small>Abdominales</small></a>
      <div class="wd off"><b>Jue</b><small>Cardio</small></div>
      <a class="wd" href="#gluteo" style="--c:var(--d4)"><b>Vie</b><small>Glúteo</small></a>
      <a class="wd" href="#piernas" style="--c:var(--d3)"><b>Sáb</b><small>Piernas</small></a>
      <div class="wd off"><b>Dom</b><small>Descanso</small></div>
    </nav>
  </header>

  <div class="prog" aria-live="polite"><div class="prog-bar"><div class="prog-fill" id="prog-fill"></div><div class="prog-txt" id="prog-txt">0 %</div></div></div>

  <main id="days" class="wrap"></main>

  <footer class="valoraciones">
    <button type="button" id="copiar-votos">Copiar mis 👍/👎</button>
    <span id="votos-msg">Pégalo en el chat cuando quieras cambiar ejercicios.</span>
  </footer>

</div>

<script>
const P = (x, y) => [x, y];
const ln = (a, b, c) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${c}"/>`;
const pl = (pts, c) => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" class="${c}"/>`;
const plate = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" class="eqf"/><circle cx="${x}" cy="${y}" r="${r * 0.3}" fill="var(--paper)"/>`;
const db = (x, y, v) => v
  ? `<line x1="${x}" y1="${y - 7}" x2="${x}" y2="${y + 7}" class="eq"/><rect x="${x - 5}" y="${y - 10}" width="10" height="5" rx="1.5" class="eqf"/><rect x="${x - 5}" y="${y + 5}" width="10" height="5" rx="1.5" class="eqf"/>`
  : `<line x1="${x - 7}" y1="${y}" x2="${x + 7}" y2="${y}" class="eq"/><rect x="${x - 10}" y="${y - 5}" width="5" height="10" rx="1.5" class="eqf"/><rect x="${x + 5}" y="${y - 5}" width="5" height="10" rx="1.5" class="eqf"/>`;
const bench = (x1, x2, y) => `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="6" rx="2" class="gearf"/><line x1="${x1 + 6}" y1="${y + 6}" x2="${x1 + 6}" y2="110" class="gear"/><line x1="${x2 - 6}" y1="${y + 6}" x2="${x2 - 6}" y2="110" class="gear"/>`;
const pullbar = (x1, x2) => `<line x1="${x1}" y1="12" x2="${x2}" y2="12" class="gear"/><line x1="${x1}" y1="12" x2="${x1}" y2="110" class="gear"/><line x1="${x2}" y1="12" x2="${x2}" y2="110" class="gear"/>`;
const arrow = (pts) => {
  const [a, b] = [pts[pts.length - 2], pts[pts.length - 1]];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const h = (d) => [b[0] - 7 * Math.cos(ang + d), b[1] - 7 * Math.sin(ang + d)];
  return pl(pts, 'mv') + `<polygon points="${b.join(',')} ${h(0.5).join(',')} ${h(-0.5).join(',')}" class="mvh"/>`;
};

// Pose: h cabeza, n hombros, p cadera, a/l brazo y pierna cercanos [codo, mano] / [rodilla, pie];
// a2/l2 lejanos (si faltan se copian desplazados). back = material detrás, front = delante.
function fig(o) {
  const sh = (seg, dx) => seg.map(([x, y]) => [x + dx, y]);
  const a2 = o.a2 || sh(o.a, -4), l2 = o.l2 || sh(o.l, -4);
  const farC = o.flat ? 'limb' : 'far';
  return `<svg viewBox="0 0 160 120" class="fig" role="img" aria-label="${o.label}">
    <line x1="6" y1="110" x2="154" y2="110" class="floor"/>
    ${o.back || ''}
    ${pl([o.n, ...a2], farC)}${pl([o.p, ...l2], farC)}
    ${ln(o.p, o.n, 'torso')}
    ${pl([o.p, ...o.l], 'limb')}${pl([o.n, ...o.a], 'limb')}
    <circle cx="${o.h[0]}" cy="${o.h[1]}" r="8.5" class="head"/>
    ${o.front || ''}
  </svg>`;
}

const DAYS = [
  { id: 'superior', c: 'var(--d1)', tag: 'Día 1 · Lunes', title: 'Espalda y brazos',
    intro: 'Primero los tirones grandes de espalda, después bíceps y tríceps cuando ya están calientes.',
    ex: [
      { n: 'Jalón al pecho', m: 'Dorsal, bíceps', r: '2 min',
        t: 'Sentada con los muslos bajo los rodillos y agarre algo más ancho que los hombros. Baja la barra hasta la parte alta del pecho llevando los codos hacia abajo, sin echarte atrás.',
        f: { label: 'Jalón al pecho sentada en máquina', h: P(66, 34), n: P(68, 46), p: P(72, 78),
             a: [P(62, 60), P(80, 44)], l: [P(94, 76), P(96, 108)],
             back: `<rect x="54" y="80" width="38" height="7" rx="2" class="gearf"/><line x1="72" y1="87" x2="72" y2="110" class="gear"/><line x1="124" y1="6" x2="124" y2="110" class="gear"/><line x1="80" y1="6" x2="124" y2="6" class="gear"/>`,
             front: `<line x1="80" y1="8" x2="80" y2="42" class="eq"/><line x1="64" y1="42" x2="98" y2="42" class="eq"/>` + arrow([[108, 22], [108, 44]]) } },
      { n: 'Remo en polea baja', m: 'Dorsal, romboides', r: '2 min',
        t: 'Sentada con los pies en la plataforma y las rodillas algo dobladas. Tira del agarre hacia el ombligo con el pecho alto y aprieta las escápulas; vuelve sin redondear la espalda.',
        f: { label: 'Remo sentada en polea baja', h: P(64, 46), n: P(62, 58), p: P(60, 92),
             a: [P(48, 74), P(68, 80)], l: [P(84, 84), P(106, 94)],
             back: `<rect x="38" y="96" width="44" height="6" rx="2" class="gearf"/><line x1="108" y1="84" x2="112" y2="104" class="gear"/><line x1="134" y1="60" x2="134" y2="110" class="gear"/>`,
             front: `<line x1="70" y1="80" x2="132" y2="96" class="eq"/>` + arrow([[104, 66], [84, 66]]) } },
      { n: 'Curl martillo', m: 'Bíceps, antebrazo', r: '90 s',
        t: 'De pie, mancuernas con las palmas mirándose. Sube sin mover los codos ni balancear el tronco y baja en dos o tres segundos.',
        f: { label: 'Curl martillo de pie con mancuernas', h: P(80, 18), n: P(80, 30), p: P(80, 64),
             a: [P(84, 48), P(98, 36)], l: [P(82, 86), P(82, 108)],
             front: db(99, 33, true) + arrow([[118, 60], [118, 42]]) } },
      { n: 'Extensión de tríceps en polea', m: 'Tríceps', r: '90 s',
        t: 'De pie frente a la polea alta con la cuerda. Codos pegados al cuerpo: empuja hacia abajo hasta estirar del todo, separa un poco las manos al final y sube despacio.',
        f: { label: 'Extensión de tríceps de pie en polea alta con cuerda', h: P(70, 18), n: P(70, 30), p: P(70, 64),
             a: [P(74, 48), P(86, 62)], l: [P(72, 86), P(72, 108)],
             back: `<line x1="124" y1="6" x2="124" y2="110" class="gear"/><line x1="108" y1="6" x2="124" y2="6" class="gear"/><rect x="116" y="76" width="14" height="28" rx="2" class="gearf"/>`,
             front: `<line x1="86" y1="60" x2="108" y2="8" class="eq"/>` + arrow([[98, 44], [98, 66]]) } },
    ] },
  { id: 'abs', c: 'var(--d2)', tag: 'Día 2 · Miércoles', title: 'Abdominales',
    intro: 'Todos con carga: elige un peso con el que la 6.ª repetición cueste. Movimientos lentos y controlados, exhala al contraer.',
    ex: [
      { n: 'Rodillas al pecho colgada con tobilleras', m: 'Recto abdominal inferior', r: '90 s',
        t: 'Colgada de la barra con tobilleras. Sube las rodillas hasta la altura de la cadera o más, redondeando un poco la pelvis, y baja en 2–3 s sin balancearte.',
        f: { label: 'Elevación de rodillas colgada de la barra con tobilleras', h: P(87, 34), n: P(80, 40), p: P(80, 72),
             a: [P(80, 27), P(80, 13)], l: [P(100, 62), P(104, 84)],
             back: pullbar(40, 120) + `<line x1="40" y1="12" x2="120" y2="12" class="eq"/>`,
             front: `<rect x="98" y="80" width="12" height="8" rx="3" class="eqf"/>` + arrow([[134, 100], [134, 78]]) } },
      { n: 'Arcoíris con barra', m: 'Oblicuos', r: '60–90 s',
        t: 'Barra con un extremo anclado (landmine) y el otro cogido con las dos manos a la altura de la frente. Llévala en arco de un lado a otro girando con el abdomen, no con los brazos. 6 por lado.',
        f: { label: 'Rotación en arco con barra anclada en el suelo', flat: true, h: P(80, 26), n: P(80, 38), p: P(80, 68),
             a: [P(92, 36), P(104, 30)], a2: [P(90, 40), P(104, 30)],
             l: [P(70, 88), P(66, 108)], l2: [P(90, 88), P(94, 108)],
             back: `<rect x="40" y="102" width="12" height="8" rx="2" class="gearf"/>`,
             front: `<line x1="46" y1="104" x2="106" y2="28" class="eq"/>` + plate(110, 24, 7) + arrow([[104, 10], [80, 6], [56, 12]]) } },
      { n: 'Peso muerto a una mano', m: 'Oblicuos, core', r: '60–90 s',
        t: 'Una mancuerna o kettlebell pesada a un lado. Baja y sube como en un peso muerto manteniendo los hombros nivelados: el abdomen no deja que el peso te incline. 6 por lado.',
        f: { label: 'Peso muerto con una sola mancuerna a un lado', flat: true, h: P(80, 34), n: P(80, 46), p: P(80, 76),
             a: [P(94, 62), P(96, 82)], a2: [P(68, 60), P(64, 74)],
             l: [P(70, 90), P(70, 108)], l2: [P(90, 90), P(90, 108)],
             front: db(96, 88, false) + arrow([[118, 92], [118, 68]]) } },
      { n: 'Plancha con disco', m: 'Core completo', r: '60 s',

             back: `<line x1="58" y1="8" x2="58" y2="110" class="gear"/><line x1="114" y1="8" x2="114" y2="110" class="gear"/><line x1="58" y1="50" x2="114" y2="50" class="eq"/>`,
             front: plate(84, 50, 13) } },
      { n: 'Zancada atrás con mancuernas', m: 'Cuádriceps, glúteo', r: '90 s',
        t: 'De pie con una mancuerna en cada mano. Da un paso largo hacia atrás, baja hasta que la rodilla de atrás casi toque el suelo y vuelve empujando con la pierna de delante. 6 por pierna.',
        f: { label: 'Zancada hacia atrás con mancuernas', h: P(74, 34), n: P(72, 46), p: P(70, 80),
             a: [P(72, 62), P(72, 78)], l: [P(94, 82), P(96, 108)], l2: [P(58, 104), P(36, 106)],
             front: db(72, 80, true) + arrow([[46, 60], [26, 60]]) } },
      { n: 'Curl femoral tumbada', m: 'Isquiotibiales', r: '90 s',
        t: 'Boca abajo en la máquina, rodillo justo por encima de los talones. Lleva los talones hacia el glúteo sin levantar la cadera y baja en 3 s.',
        f: { label: 'Curl femoral tumbada boca abajo en máquina', h: P(28, 62), n: P(38, 66), p: P(76, 66),
             a: [P(34, 76), P(26, 74)], l: [P(98, 66), P(104, 44)],
             back: bench(18, 112, 72), front: `<rect x="100" y="38" width="14" height="10" rx="4" class="eqf"/>` + arrow([[126, 64], [122, 40]]) } },
      { n: 'Gemelo sentada', m: 'Sóleo, gemelos', r: '60 s',
        t: 'Sentada con las puntas en un escalón y un disco o mancuernas sobre las rodillas. Baja el talón todo lo posible, sube al máximo y aguanta 1 s arriba.',
        f: { label: 'Elevación de talones sentada con disco en las rodillas', h: P(65, 32), n: P(64, 44), p: P(66, 76),
             a: [P(78, 58), P(88, 68)], l: [P(92, 74), P(92, 96)],
             back: bench(40, 80, 80) + `<rect x="94" y="102" width="22" height="8" rx="2" class="gearf"/>`,
             front: ln(P(92, 96), P(102, 102), 'limb') + plate(90, 68, 8) + arrow([[124, 96], [124, 74]]) } },
    ] },
  { id: 'gluteo', c: 'var(--d4)', tag: 'Día 3 · Viernes', title: 'Glúteo',
    intro: 'Empuje de cadera pesado al principio y trabajo de glúteo medio al final. Aprieta el glúteo un segundo en la posición alta de cada repetición.',
    ex: [
      { n: 'Puente de glúteo con barra', m: 'Glúteo mayor', r: '2–3 min',
        t: 'Tumbada en el suelo con la barra sobre la cadera (con almohadilla) y los pies cerca del glúteo. Sube la cadera hasta alinear rodillas y hombros, aprieta 1 s y baja sin apoyar del todo.',
        f: { label: 'Puente de glúteo en el suelo con barra', h: P(26, 100), n: P(36, 102), p: P(72, 84),
             a: [P(54, 94), P(68, 84)], l: [P(94, 74), P(100, 108)],
             front: plate(72, 72, 12) + arrow([[124, 100], [124, 78]]) } },
      { n: 'Peso muerto a una pierna', m: 'Glúteo, isquiotibiales', r: '90 s',
        t: 'Mancuerna en la mano contraria a la pierna de apoyo. Inclina el tronco hacia delante mientras la otra pierna sube estirada por detrás, con la cadera recta, y vuelve apretando el glúteo. 6 por pierna.',
        f: { label: 'Peso muerto a una pierna con mancuerna', h: P(118, 54), n: P(108, 58), p: P(76, 64),
             a: [P(108, 74), P(108, 90)], l: [P(80, 86), P(80, 108)], l2: [P(54, 58), P(32, 54)],
             front: db(108, 93, true) } },
      { n: 'Sentadilla sumo con mancuerna', m: 'Glúteo, aductores', r: '90 s',
        t: 'Pies muy abiertos y puntas hacia fuera, mancuerna colgando entre las piernas. Baja con el tronco erguido y las rodillas hacia fuera, y sube apretando el glúteo.',
        f: { label: 'Sentadilla sumo con mancuerna entre las piernas', flat: true, h: P(80, 40), n: P(80, 52), p: P(80, 80),
             a: [P(74, 66), P(78, 84)], a2: [P(86, 66), P(82, 84)],
             l: [P(60, 88), P(54, 108)], l2: [P(100, 88), P(106, 108)],
             front: db(80, 92, true) } },
      { n: 'Abducción de cadera en máquina', m: 'Glúteo medio', r: '60 s',
        t: 'Sentada en la máquina con la espalda apoyada. Abre las rodillas contra las almohadillas todo lo que puedas, aguanta 1 s y cierra despacio sin dejar que el peso choque.',
        f: { label: 'Abducción de cadera sentada en máquina', flat: true, h: P(80, 30), n: P(80, 42), p: P(80, 74),
             a: [P(66, 58), P(62, 74)], a2: [P(94, 58), P(98, 74)],
             l: [P(60, 82), P(58, 106)], l2: [P(100, 82), P(102, 106)],
             back: `<rect x="56" y="76" width="48" height="7" rx="2" class="gearf"/>`,
             front: `<rect x="46" y="74" width="7" height="16" rx="3" class="eqf"/><rect x="107" y="74" width="7" height="16" rx="3" class="eqf"/>` + arrow([[42, 100], [26, 100]]) + arrow([[118, 100], [134, 100]]) } },
    ] },
];

// Sin zoom: iOS ignora a veces user-scalable, así que se bloquea el pellizco; el doble toque lo quita touch-action.
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// Actualización automática: GitHub Pages guarda la página en caché unos minutos.
// Si version.txt no coincide con esta versión, se recarga con una URL nueva.
const VERSION = '16';
fetch('./version.txt', { cache: 'no-store' }).then(r => r.ok ? r.text() : VERSION).then(v => {
  v = v.trim();
  if (v && v !== VERSION && !location.search.includes('v=' + v)) location.replace('./?v=' + v);
}).catch(() => {});

let store = {};
try { store = JSON.parse(localStorage.getItem('plan6x6') || '{}'); } catch (e) { store = {}; }
// Al cambiar los ejercicios de la semana, las series marcadas de la anterior se borran.
const PLAN_WEEK = '2026-11-09';
try {
  if (localStorage.getItem('plan6x6-semana') !== PLAN_WEEK) { store = {}; localStorage.setItem('plan6x6', '{}'); localStorage.setItem('plan6x6-semana', PLAN_WEEK); }
} catch (e) {}
const save = () => { try { localStorage.setItem('plan6x6', JSON.stringify(store)); } catch (e) {} };

// Pesos: historial por ejercicio { 'abs-Sit-up con disco': [{ w: 10, d: '2026-10-30' }, ...] }
let pesos = {};
try { pesos = JSON.parse(localStorage.getItem('plan6x6-pesos') || '{}'); } catch (e) { pesos = {}; }
const savePesos = () => { try { localStorage.setItem('plan6x6-pesos', JSON.stringify(pesos)); } catch (e) {} };
// Valoraciones por ejercicio (por nombre, así sobreviven a cambios de orden): { 'Pallof press': 'up' | 'down' }
// Peso orientativo para empezar (Chloe, 60 kg). Es un punto de partida: el peso apuntado manda después.
const SUGERIDO = {
  'Jalón al pecho': '25–30 kg',
  'Remo en polea baja': '25–30 kg',
  'Curl martillo': '6–8 kg por mano',
  'Extensión de tríceps en polea': '10–15 kg',
  'Rodillas al pecho colgada con tobilleras': 'tobilleras de 1–2 kg',
  'Arcoíris con barra': 'barra con discos de 2,5–5 kg',
  'Peso muerto a una mano': '14–20 kg',
  'Plancha con disco': 'disco de 10 kg',
  'Sentadilla en multipower': '30–40 kg',
  'Zancada atrás con mancuernas': '6–10 kg por mano',
  'Curl femoral tumbada': '15–25 kg',
  'Gemelo sentada': 'disco de 15–20 kg',
  'Puente de glúteo con barra': '40–60 kg',
  'Peso muerto a una pierna': '8–12 kg',
  'Sentadilla sumo con mancuerna': '14–20 kg',
  'Abducción de cadera en máquina': '30–40 kg',
};

let votos = {};
try { votos = JSON.parse(localStorage.getItem('plan6x6-votos') || '{}'); } catch (e) { votos = {}; }
const saveVotos = () => { try { localStorage.setItem('plan6x6-votos', JSON.stringify(votos)); } catch (e) {} };

const fmtW = w => String(w).replace('.', ',');
const fmtD = d => new Date(d + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
function lastText(k) {
  const h = pesos[k] || [];
  if (!h.length) return 'Aún sin peso apuntado.';
  const a = h[h.length - 1], b = h[h.length - 2];
  let t = `Última vez: <b>${fmtW(a.w)} kg</b> · ${fmtD(a.d)}`;
  if (b) t += ` <span>(antes ${fmtW(b.w)} kg)</span>`;
  return t;
}

// Fuente de titulares sin bloquear la carga: la página se pinta antes con la fuente del sistema.
const fl = document.createElement('link');
fl.rel = 'stylesheet';
fl.href = 'https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap';
document.head.appendChild(fl);

const main = document.getElementById('days');
main.innerHTML = [...DAYS].sort((a, b) => a.tag.localeCompare(b.tag)).map(d => `
  <section class="day" id="${d.id}" style="--c:${d.c}">
    <div class="dayhead">
      <div>
        <div class="tag">${d.tag}</div>
        <h2>${d.title}</h2>
        <p>${d.intro}</p>
      </div>
      <button class="reset" type="button" id="reset-${d.id}" data-day="${d.id}">Reiniciar series</button>
    </div>
    <div class="grid">
      ${d.ex.map((e, i) => `
        <article class="card">
          <div class="art"><span class="num">${i + 1}</span><span class="scheme">6×6</span>${fig(e.f)}</div>
          <div class="body">
            <h3>${e.n}</h3>
            <div class="meta"><span class="chip">${e.m}</span><span class="chip rest">Descanso ${e.r}</span>${SUGERIDO[e.n] ? `<span class="chip rest">Empieza con ${SUGERIDO[e.n]}</span>` : ''}</div>
            <p class="tip">${e.t}</p>
            <div class="peso">
              <div class="peso-row">
                <label for="peso-${d.id}-${i}">Peso</label>
                <input id="peso-${d.id}-${i}" type="text" inputmode="decimal" placeholder="0" value="${(pesos[d.id + '-' + e.n] || []).slice(-1).map(x => fmtW(x.w)).join('')}">
                <span class="kg">kg</span>
                <button class="guardar" type="button" data-peso="${d.id}-${e.n}" data-input="peso-${d.id}-${i}">Guardar</button>
              </div>
              <p class="last" id="last-${d.id}-${i}">${lastText(d.id + '-' + e.n)}</p>
            </div>
            <div class="sets"><span>Series</span>
              ${[1, 2, 3, 4, 5, 6].map(s => {
                const k = `${d.id}-${i}-${s}`;
                return `<button class="set" type="button" id="set-${k}" data-k="${k}" aria-pressed="${!!store[k]}" aria-label="Serie ${s} de ${e.n}">${s}</button>`;
              }).join('')}
              <button class="all" type="button" id="all-${d.id}-${i}" data-all="${d.id}-${i}" aria-pressed="${[1, 2, 3, 4, 5, 6].every(s => store[`${d.id}-${i}-${s}`])}" aria-label="Marcar las 6 series de ${e.n}">✓ Todas</button>
            </div>
            <div class="voto" id="voto-${d.id}-${i}" ${[1, 2, 3, 4, 5, 6].every(s => store[`${d.id}-${i}-${s}`]) || votos[e.n] ? '' : 'hidden'}>
              <span>¿Qué tal?</span>
              <button type="button" id="up-${d.id}-${i}" data-voto="up" data-n="${e.n}" aria-pressed="${votos[e.n] === 'up'}" aria-label="Me gusta ${e.n}">👍</button>
              <button type="button" id="down-${d.id}-${i}" data-voto="down" data-n="${e.n}" aria-pressed="${votos[e.n] === 'down'}" aria-label="No me gusta ${e.n}">👎</button>
            </div>
          </div>
        </article>`).join('')}
    </div>
  </section>`).join('');

const syncAll = ex => {
  const on = [1, 2, 3, 4, 5, 6].every(s => store[`${ex}-${s}`]);
  document.getElementById('all-' + ex).setAttribute('aria-pressed', on);
  const v = document.getElementById('voto-' + ex);
  v.hidden = !on && !votos[v.querySelector('button').dataset.n];
};

// Un solo día visible. Sin #día en la dirección se abre el de hoy o el siguiente entrenamiento.
const BY_WEEKDAY = { 1: 'superior', 3: 'abs', 5: 'gluteo', 6: 'piernas' };
function hoyId() {
  for (let i = 0, wd = new Date().getDay(); i < 7; i++) {
    const id = BY_WEEKDAY[(wd + i) % 7];
    if (id) return id;
  }
}
// % de series hechas del día visible (4 ejercicios × 6 series).
function updProg() {
  const sets = [...document.querySelectorAll('section.day.on .set')];
  const pct = sets.length ? Math.round(100 * sets.filter(b => b.getAttribute('aria-pressed') === 'true').length / sets.length) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-txt').textContent = pct + ' %';
}
function showDay() {
  const id = DAYS.some(d => d.id === location.hash.slice(1)) ? location.hash.slice(1) : hoyId();
  document.querySelectorAll('section.day').forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('a.wd').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + id));
  updProg();
  window.scrollTo(0, 0);
}
document.querySelector('.week').addEventListener('click', ev => {
  const a = ev.target.closest('a.wd');
  if (!a) return;
  ev.preventDefault();
  history.replaceState(null, '', a.getAttribute('href'));
  showDay();
});
window.addEventListener('hashchange', showDay);
main.addEventListener('click', () => setTimeout(updProg)); // después de que se marque la serie
showDay();

document.getElementById('copiar-votos').addEventListener('click', () => {
  const up = Object.keys(votos).filter(n => votos[n] === 'up'), down = Object.keys(votos).filter(n => votos[n] === 'down');
  const msg = document.getElementById('votos-msg');
  if (!up.length && !down.length) { msg.textContent = 'Aún no has valorado ningún ejercicio.'; return; }
  const txt = `Mis valoraciones del plan 6×6\n👍 ${up.join(', ') || '—'}\n👎 ${down.join(', ') || '—'}`;
  const ok = () => { msg.textContent = 'Copiado. Pégalo en el chat.'; };
  const fallback = () => { msg.textContent = txt; };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
});

main.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.peso) {
    const inp = document.getElementById(b.dataset.input);
    const w = parseFloat(inp.value.replace(',', '.'));
    if (!(w >= 0)) { inp.focus(); return; }
    const k = b.dataset.peso, hoy = new Date().toLocaleDateString('sv');
    const h = pesos[k] = pesos[k] || [];
    if (h.length && h[h.length - 1].d === hoy) h[h.length - 1].w = w; else h.push({ w, d: hoy });
    if (h.length > 30) h.splice(0, h.length - 30);
    savePesos();
    inp.value = fmtW(w);
    document.getElementById(b.dataset.input.replace('peso-', 'last-')).innerHTML = lastText(k);
    b.textContent = 'Guardado ✓';
    setTimeout(() => { b.textContent = 'Guardar'; }, 1500);
    return;
  }
  if (b.dataset.voto) {
    const n = b.dataset.n, on = b.getAttribute('aria-pressed') !== 'true';
    if (on) votos[n] = b.dataset.voto; else delete votos[n];
    saveVotos();
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', on && x === b));
    return;
  }
  if (b.dataset.k) {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    if (on) store[b.dataset.k] = 1; else delete store[b.dataset.k];
    save();
    syncAll(b.dataset.k.replace(/-\d+$/, ''));
  } else if (b.dataset.all) {
    const ex = b.dataset.all, on = b.getAttribute('aria-pressed') !== 'true';
    for (let s = 1; s <= 6; s++) {
      const k = `${ex}-${s}`;
      if (on) store[k] = 1; else delete store[k];
      document.getElementById('set-' + k).setAttribute('aria-pressed', on);
    }
    b.setAttribute('aria-pressed', on);
    save();
    syncAll(ex);
  } else if (b.dataset.day) {
    const day = b.dataset.day;
    Object.keys(store).forEach(k => { if (k.startsWith(day + '-')) delete store[k]; });
    document.querySelectorAll(`#${day} .set, #${day} .all`).forEach(s => s.setAttribute('aria-pressed', 'false'));
    save();
    document.querySelectorAll(`#${day} .voto`).forEach(v => { v.hidden = !votos[v.querySelector('button').dataset.n]; });
  }
});
</script>

</body></html>
